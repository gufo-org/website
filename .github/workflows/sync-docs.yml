name: Sync Gufo docs

# Gufo sends `gufo-release` with each new tag, which becomes a release version,
# and `gufo-docs` when a push to main changes its public docs, which refreshes
# the "development" version. A manual run syncs any ref: a vX.Y.Z tag as a
# release, anything else under the version name given (default development).
on:
  repository_dispatch:
    types: [gufo-release, gufo-docs]
  workflow_dispatch:
    inputs:
      ref:
        description: Gufo tag, branch or commit, for example v0.32.0 or main
        required: true
      version:
        description: Version name for a ref that is not a release tag
        default: development

# The release app's token pushes, opens and merges the pull request, so the
# repository never has to let GITHUB_TOKEN create pull requests, and its merge
# triggers the Pages deploy like any other push to main.
permissions:
  contents: read

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the Gufo ref
        id: ref
        env:
          EVENT: ${{ github.event_name == 'repository_dispatch' && github.event.action || 'manual' }}
          TAG: ${{ github.event.client_payload.tag }}
          PUSHED: ${{ github.event.client_payload.ref }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version || 'development' }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            gufo-release) ref="$TAG"; version="" ;;
            gufo-docs) ref="$PUSHED"; version=development ;;
            *) ref="$INPUT_REF"; version="$INPUT_VERSION" ;;
          esac
          if [[ "$ref" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            version="${ref#v}"
            release=true
          elif [[ "$EVENT" == gufo-release ]]; then
            echo "Expected a vX.Y.Z tag, got: $ref" >&2
            exit 1
          elif [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release=false
          else
            echo "Invalid version name for a non-release ref: $version" >&2
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "version=$version"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: website
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out Gufo
        uses: actions/checkout@v4
        with:
          repository: gufo-org/gufo
          ref: ${{ steps.ref.outputs.ref }}
          path: gufo-src
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Copy the public docs
        env:
          VERSION: ${{ steps.ref.outputs.version }}
          RELEASE: ${{ steps.ref.outputs.release }}
          REF: ${{ steps.ref.outputs.ref }}
          EVENT: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # Releases link GitHub at their tag and development at main, so an
          # unchanged page stays unchanged; other refs pin the exact commit.
          release_flag=()
          if [[ "$RELEASE" == true ]]; then
            link_ref="$REF"
            release_flag=(--release)
          elif [[ "$EVENT" == gufo-docs || "$REF" == main ]]; then
            link_ref=main
          else
            link_ref="$(git -C gufo-src rev-parse HEAD)"
          fi
          node scripts/sync-docs.mjs --source gufo-src --version "$VERSION" --ref "$link_ref" \
            "${release_flag[@]}" --keep 10
          rm -rf gufo-src

      - name: Check and build the site
        run: |
          pnpm install --frozen-lockfile
          pnpm astro check
          pnpm build

      - name: Merge the docs through a pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.ref.outputs.version }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- src/content/docs)" ]]; then
            echo "Docs for $VERSION are already up to date."
            exit 0
          fi
          bot="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          branch="docs/sync-$VERSION-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add src/content/docs
          git commit -m "docs: sync Gufo $VERSION docs from $REF"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: sync Gufo $VERSION docs" \
            --body "Synced by the \`Sync Gufo docs\` workflow from gufo-org/gufo \`$REF\`. The site checked and built in [the workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          gh pr merge "$branch" --squash --delete-branch
